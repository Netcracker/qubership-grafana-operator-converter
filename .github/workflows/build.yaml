---
name: Build Artifacts
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  release:
    types: [created]
  push:
    branches:
    - 'main'
    paths-ignore:
    - '.github/**'
    - 'docs/**'
    - 'CODE-OF-CONDUCT.md'
    - 'CONTRIBUTING.md'
    - 'LICENSE'
    - 'README.md'
    - 'SECURITY.md'
  pull_request:
    branches:
    - '**'

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Detect image build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
      publish: ${{ steps.filter.outputs.publish }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Match changed files against the image build paths
      id: filter
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SENDER_TYPE: ${{ github.event.sender.type }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" != 'pull_request' ]]; then
          echo 'build=true' >> "${GITHUB_OUTPUT}"
          if [[ "${SENDER_TYPE}" == 'Bot' ]]; then
            echo 'publish=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'publish=true' >> "${GITHUB_OUTPUT}"
          fi
          exit 0
        fi

        echo 'publish=false' >> "${GITHUB_OUTPUT}"
        changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
        echo "Changed files:"
        printf '%s\n' "${changed}"

        build=false
        while IFS= read -r file; do
          case "${file}" in
            .github/workflows/build.yaml)
              build=true
              break
              ;;
            .github/*|docs/*|CODE-OF-CONDUCT.md|CONTRIBUTING.md|LICENSE|README.md|SECURITY.md)
              ;;
            *)
              build=true
              break
              ;;
          esac
        done <<< "${changed}"
        echo "build=${build}" >> "${GITHUB_OUTPUT}"

  multiplatform_build:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: qubership-grafana-operator-converter
          file: Dockerfile
          context: .
    runs-on: ubuntu-latest
    name: ${{ matrix.component.name }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - name: Build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64,linux/arm64
        push: false
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  multiplatform_publish:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: qubership-grafana-operator-converter
          file: Dockerfile
          context: .
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.component.name }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  docker-gate:
    name: Docker Gate
    needs: [changes, multiplatform_build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Require the expected image build result
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.build != 'false' && needs.multiplatform_build.result != 'success')
      run: exit 1
