name: Go test with Sonar
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: go-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve sonar project key based on restricted actors
        id: config
        env:
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          restricted=$(python3 -c "
          import yaml, os
          with open('.github/config/build-config.yaml') as f:
              config = yaml.safe_load(f)
          actors = config.get('restricted-actors', [])
          current_actors = [os.environ['ACTOR'], os.environ.get('PR_AUTHOR', '')]
          print('true' if any(actor in actors for actor in current_actors) else 'false')
          ")
          if [ "$restricted" = "true" ]; then
            echo "sonar-project-key=" >> "$GITHUB_OUTPUT"
          else
            echo "sonar-project-key=${SONAR_PROJECT_KEY}" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint Go modules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          only-new-issues: true
          args: --timeout=10m

  test:
    needs: prepare
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Build and test with coverage
    uses: netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      go-module-dir: '.'
      sonar-project-key: ${{ needs.prepare.outputs.sonar-project-key }}
      kube-version: '1.30.0'
      envtest-version: 'release-0.20'
      cover-packages: './controllers/...,./api/...'
      install-envtest: true
      skip-docker: true
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      packages: write

  # ponytail: remove this fallback after core-infra#367 ships in the pinned reusable workflow.
  fork-test:
    name: Test fork without repository secrets
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...

  ci-gate:
    name: Go CI Gate
    needs: [prepare, lint, test, fork-test]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require Go validation
        if: >-
          needs.prepare.result != 'success' ||
          needs.lint.result != 'success' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          needs.test.result != 'success') ||
          (github.event.pull_request.head.repo.full_name != github.repository &&
          needs.fork-test.result != 'success')
        run: exit 1
